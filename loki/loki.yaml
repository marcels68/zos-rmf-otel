# Loki (Einzelprozess, Dateisystem) für SMF-Sätze als OpenTelemetry-Logs
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ingester:
  # Einträge werden je Datenstrom bis max_chunk_age/2 hinter dem neuesten angenommen.
  # 48h -> SMF-Dumps bis 24 Stunden alt lassen sich auch nach Live-Daten einspielen.
  max_chunk_age: 48h
  chunk_idle_period: 2h
limits_config:
  allow_structured_metadata: true
  # SMF-Dumps enthalten ältere Sätze: nicht ablehnen
  reject_old_samples: false
  max_query_lookback: 0s
  retention_period: 30d
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  volume_enabled: true
pattern_ingester:
  enabled: false
analytics:
  reporting_enabled: false
